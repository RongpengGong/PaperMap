{# The AI discussion box, shared by the paper panel and the page drawer. #}
{% macro chat_inner() %}
    <div class="chat-top">
      <select data-chat-model title="{{ _("用哪个模型讨论（在设置里配置过的都可以选）") }}"></select>
      <select data-chat-effort hidden title="{{ _("推理强度：越高越仔细，也越慢、越耗额度") }}"></select>
      <span class="grow"></span>
      <button type="button" class="ghost-btn" data-chat-new title="{{ _("清空这次对话，重新开始") }}">{{ _("新对话") }}</button>
    </div>
    <div class="chat-log" data-chat-log></div>
    <div class="chat-summary" data-chat-summary hidden>
      <p class="small"><b>{{ _("讨论要点（写入前可以修改）") }}</b></p>
      <textarea rows="8" data-chat-summary-text></textarea>
      <div class="chat-summary-foot">
        <label class="inline small"><input type="checkbox" data-chat-clear checked> {{ _("写入后清空这次对话") }}</label>
        <span class="grow"></span>
        <button type="button" class="ghost" data-chat-summary-cancel>{{ _("取消") }}</button>
        <button type="button" data-chat-write>{{ _("写入笔记") }}</button>
      </div>
    </div>
    <div class="chat-compose">
      <div class="chat-quote" data-chat-quote hidden><span data-chat-quote-text></span><button type="button" class="icon-btn" data-chat-quote-x title="{{ _("去掉引用") }}">×</button></div>
      <textarea rows="2" data-chat-text placeholder="{{ _("问点什么，或在 PDF 里选中一段点「问 AI」。⌘↩ 发送") }}"></textarea>
      <div class="chat-compose-foot">
        <button type="button" class="ghost-btn" data-chat-end title="{{ _("让模型总结这次讨论，你确认后追加到「我的笔记」") }}">{{ _("结束讨论，总结到笔记") }}</button>
        <span class="grow"></span>
        <select class="chat-enter" data-chat-enter title="{{ _("用哪个键发送；另一个用来换行") }}">
          <option value="enter">{{ _("↩ 发送，⇧↩ 换行") }}</option>
          <option value="cmd">{{ _("⌘↩ 发送，↩ 换行") }}</option>
        </select>
        <button type="button" data-chat-send>{{ _("发送") }}</button>
      </div>
      <p class="muted small chat-privacy">{{ _("论文全文、卡片和你的笔记会发给所选模型的服务商；费用计入费用页。") }}</p>
    </div>
{% endmacro %}
