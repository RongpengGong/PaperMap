<dialog id="evidence-dialog" class="evidence-dialog" aria-labelledby="evidence-dialog-title">
  <form id="capture-evidence">
    <h2 id="evidence-dialog-title">{{ _("摘到证据笔记") }}</h2>
    <p class="small muted" id="capture-page"></p>
    <blockquote id="capture-quote"></blockquote>
    <div id="capture-region-fields" hidden>
      <canvas id="capture-preview" class="ev-region-preview" aria-label="{{ _("选中的图表区域") }}"></canvas>
      <label for="capture-region-label">{{ _("图表标记") }}</label>
      <input id="capture-region-label" type="text" maxlength="200" placeholder="{{ _("例如 Fig. 3B 或 Table 2 第四行") }}">
    </div>
    <label for="capture-question">{{ _("研究问题") }}</label>
    <select id="capture-question"></select>
    <label for="capture-title" class="ev-new-label">{{ _("新问题") }}</label>
    <input id="capture-title" type="text" maxlength="300" placeholder="{{ _("你想用这些论文回答什么问题？") }}">
    <label for="capture-stance">{{ _("与问题的关系") }}</label>
    <select id="capture-stance"><option value="pending">{{ _("待核对") }}</option><option value="supports">{{ _("支持") }}</option><option value="opposes">{{ _("相反") }}</option></select>
    <label for="capture-dimension">{{ _("对照项目") }}</label>
    <select id="capture-dimension"></select>
    <label for="capture-note">{{ _("我的笔记（可选）") }}</label>
    <textarea id="capture-note" rows="2" maxlength="12000"></textarea>
    <p class="err-text small" role="alert" id="capture-error" hidden></p>
    <div class="ev-actions"><button type="button" class="secondary" id="capture-cancel">{{ _("取消") }}</button><button type="submit" id="capture-save">{{ _("保存摘录") }}</button></div>
  </form>
</dialog>
