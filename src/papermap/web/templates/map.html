{% extends "base.html" %}
{% block title %}知识地图 - PaperMap{% endblock %}
{% block content %}
<div class="map-bar">
  <h2>知识地图</h2>
  <label class="inline"><input type="checkbox" id="fields_only"> 只看学科</label>
  <label class="inline"><input type="checkbox" id="show_topics" checked> 显示主题</label>
  <span class="legend"><i class="dot method"></i>方法学 <i class="dot topic"></i>主题 <i class="dot paper"></i>论文</span>
  <span class="muted">滚轮缩放 · 拖动平移 · 拖动节点 · 点击打开</span>
</div>
<div id="map_wrap"><canvas id="map"></canvas><div id="tip" hidden></div>
<p id="map_empty" class="muted" hidden>还没有已分类的论文。论文处理完成后会自动分类，也可以在「分类表」页面点「开始分类」。</p></div>
<script src="/static/map.js"></script>
{% endblock %}
