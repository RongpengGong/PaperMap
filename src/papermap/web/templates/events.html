{% extends "base.html" %}
{% block content %}
<h2>{{ _("活动日志") }}</h2>
<table><tr><th>{{ _("时间") }}</th><th>{{ _("级别") }}</th><th>{{ _("内容") }}</th></tr>
{% for e in events %}<tr><td class="muted">{{ e.created_at }}</td><td><span class="chip {{ 'error' if e.level == 'error' else '' }}">{{ e.level }}</span></td>
<td>{{ e.message }}{% if e.paper_id %} · <a href="/paper/{{ e.paper_id }}">#{{ e.paper_id }}</a>{% endif %}</td></tr>{% endfor %}
</table>
{% endblock %}
