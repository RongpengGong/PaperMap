[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papermap"
version = "0.1.0"
description = "Local literature manager: detect new PDFs, extract DOIs, build a Markdown knowledge map with an LLM."
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "httpx>=0.27",
  "openai>=1.40",
  "watchdog>=4.0",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "rapidfuzz>=3.6",
  "markdown>=3.5",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
papermap = "papermap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papermap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
