[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papermap"
version = "0.1.0"
description = "Local literature manager: detect new PDFs, extract DOIs, build a Markdown knowledge map with an LLM."
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
readme = "README.en.md"
authors = [{ name = "Rongpeng Gong" }]
dependencies = [
  "pymupdf>=1.24",
  "tzdata; sys_platform == 'win32'",  # zoneinfo has no system database on Windows
  "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
  "httpx>=0.27",
  "openai>=1.40",
  "watchdog>=4.0",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "mcp>=1.26,<2",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "rapidfuzz>=3.6",
  "markdown>=3.5",
  "nh3>=0.3",
  "python-multipart>=0.0.9",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=41",
  "psutil>=5.9",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.0", "pystray>=0.19", "pillow>=10", "pywebview>=5"]
desktop = ["pywebview>=5", "pystray>=0.19", "pillow>=10"]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
papermap = "papermap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papermap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
